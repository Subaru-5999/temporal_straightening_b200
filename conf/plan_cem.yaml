defaults:
  - _self_
  # Single-GPU B200 pod (no SLURM): run locally. Switch back to submitit_slurm on a cluster.
  - override hydra/launcher: submitit_local

hydra:
  run:
    # CEM sub_planner has no lr/action_noise/sample_type (those are GD-only);
    # interpolate only the keys that exist, else Hydra errors at job start.
    dir: plan_outputs_cem/${replace_slash:${model_name}}_gH${goal_H}_${goal_source}/${ckpt_base_path}_cem_ns${planner.sub_planner.num_samples}_topk${planner.sub_planner.topk}_opt${planner.sub_planner.opt_steps}_obj${objective.mode}
  sweep:
    dir: plan_outputs_cem/${replace_slash:${model_name}}_gH${goal_H}_${goal_source}/${ckpt_base_path}_cem_ns${planner.sub_planner.num_samples}_topk${planner.sub_planner.topk}_opt${planner.sub_planner.opt_steps}_obj${objective.mode}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    gpus_per_node: 1
    cpus_per_task: 16
    mem_gb: 64
    timeout_min: 720

ckpt_base_path: ./checkpoints # model to load for planning
model_name: null
model_epoch: latest
seed: 100
n_evals: 50
goal_source: 'dset'
goal_H: 25 
n_plot_samples: 10
decode_for_viz: true  # if false, skip world-model decoding/rollout visualization during eval
num_start_frames: 1

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0
  base: 2 
  mode: last
  # See planning/objectives.py. false keeps every tracked run byte-identical.
  normalize: false

planner:
  _target_: planning.mpc.MPCPlanner
  max_iter: 1
  n_taken_actions: 25
  sub_planner:
    target: planning.cem.CEMPlanner
    horizon: 25
    topk: 30
    num_samples: 200
    var_scale: 1
    opt_steps: 10
    eval_every: 1
  name: mpc_cem
